[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sapc"
version = "1.0.0"
description = "Self-Attention PatchCore with Normalizing Flow and Learnable Positional Encoding for anomaly detection in whole-body PET MIP images"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0",
  "torchvision>=0.15",
  "FrEIA>=0.2",
  "faiss-cpu>=1.7",
  "scikit-learn>=1.2",
  "opencv-python-headless>=4.7",
  "numpy",
  "pyyaml",
  "tqdm",
  "matplotlib",
]

[project.optional-dependencies]
umap = ["umap-learn"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:Soft permutation:UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
