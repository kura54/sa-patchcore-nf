# Proposed model (master's thesis): self-attention PatchCore + normalizing flow
# + learnable positional encoding from k-means clusters and InfoNCE.
name: sa_patchcore_nf_lpe
data:
  root: data
model:
  self_attention: true
  normalizing_flow: true
  positional_encoding: learnable
flow:
  condition_dim: 1024
  coupling_blocks: 25
  clamp_alpha: 2.8
  epochs: 100
  lr: 1.0e-4
  fiber_batch: 1024
  patience: 5
lpe:
  clusters: 7
  embed_dim: 256
  tau: 0.07
  epochs: 10
  lr: 1.0e-4
  batch_size: 512
  test_onehot: uniform
coreset:
  ratio: 0.4
  projection_dim: 1024
